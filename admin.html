<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수행평가 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<section class="screen" id="a-login">
  <div class="center">
    <form class="card login-card" id="a-login-form" autocomplete="off">
      <div class="logo">🧑‍🏫</div>
      <h1>수행평가 관리</h1>
      <p class="sub">관리자 비밀번호 입력</p>
      <div class="field"><input class="input" id="a-pw" type="password" placeholder="관리자 비밀번호"></div>
      <div class="error" id="a-login-error"></div>
      <button class="btn full" type="submit">들어가기</button>
    </form>
  </div>
</section>

<section class="screen" id="a-main">
  <div class="wrap admin-wrap">
    <div class="a-head">
      <div>
        <h1>수행평가 관리</h1>
        <div class="muted" id="a-updated"></div>
      </div>
      <div class="a-tools">
        <select class="input sel" id="a-class"></select>
        <button class="btn gray sm" id="a-refresh">새로고침</button>
        <button class="btn gray sm" id="a-add">명단 추가</button>
        <button class="btn gray sm" id="a-csv" disabled>CSV 내보내기</button>
        <button class="btn sm" id="a-lock">평가 잠금</button>
      </div>
    </div>
    <div id="a-lock-notice"></div>
    <div class="stats" id="a-stats"></div>
    <div class="sel-bar" id="a-sel-bar"></div>
    <div class="card table-card">
      <table class="tbl">
        <thead><tr><th class="ck"><input type="checkbox" id="a-check-all" title="보이는 학생 모두 선택"></th><th>학번</th><th>이름</th><th>비밀번호</th><th>진행</th><th>사용한 그래프</th><th>이탈</th><th>상태</th><th></th></tr></thead>
        <tbody id="a-rows"></tbody>
      </table>
      <div class="empty" id="a-empty" hidden>학생 없음. 학생이 로그인하거나 명단을 추가하면 표시</div>
    </div>
  </div>
</section>

<!-- 학생 상세 -->
<div class="overlay" id="ov-detail">
  <div class="modal wide detail">
    <div class="d-head">
      <div><h2 id="d-title"></h2><div id="d-badges"></div></div>
      <div class="d-tools">
        <button class="btn gray sm" id="d-unsubmit" hidden>제출 취소</button>
        <button class="btn gray sm" id="d-close">닫기</button>
      </div>
    </div>
    <div class="d-answers" id="d-answers"></div>
    <h2 class="d-sub">이탈 기록 <span class="muted" id="d-log-count"></span></h2>
    <table class="tbl small"><thead><tr><th>시간</th><th>종류</th><th>내용</th></tr></thead><tbody id="d-logs"></tbody></table>
  </div>
</div>

<!-- 명단 추가 -->
<div class="overlay" id="ov-add">
  <div class="modal">
    <h2>명단 추가</h2>
    <p>한 줄에 한 명, "학번 이름" 형식. 엑셀에서 두 열을 복사해 붙여넣기 가능</p>
    <textarea class="input" id="add-text" style="height:200px;padding:12px;font-size:15px" placeholder="10301 김하나&#10;10302 이두리"></textarea>
    <div class="error" id="add-error"></div>
    <div class="btns"><button class="btn gray" id="add-cancel">취소</button><button class="btn" id="add-ok">추가</button></div>
  </div>
</div>

<!-- 확인 창 -->
<div class="overlay" id="ov-confirm">
  <div class="modal">
    <h2 id="cf-title"></h2>
    <p id="cf-text"></p>
    <div class="btns"><button class="btn gray" id="cf-no">취소</button><button class="btn" id="cf-yes">확인</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/config.js"></script>
<script src="js/core.js"></script>
<script src="js/api.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
